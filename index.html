<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Congklatika - Belajar Matematika Seru!</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #FF6B6B;
            --secondary: #4ECDC4;
            --accent: #FFE66D;
            --dark: #2C3E50;
            --light: #F7FFF7;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Quicksand', sans-serif;
        }

        body {
            background-color: #A8E6CF;
            background-image: radial-gradient(#DCEDC1 20%, transparent 20%);
            background-size: 20px 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 24px;
            padding: 30px;
            max-width: 600px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            border: 4px solid var(--dark);
        }

        h1 {
            font-family: 'Fredoka One', cursive;
            color: var(--primary);
            font-size: 2.5rem;
            margin-bottom: 15px;
            text-shadow: 2px 2px 0px var(--accent);
        }

        .mascot {
            font-size: 80px;
            display: inline-block;
            margin: 15px 0;
            animation: bounce 1.5s infinite alternate ease-in-out;
            cursor: pointer;
            user-select: none;
        }

        @keyframes bounce {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(-20px) scale(1.1); }
        }

        .btn {
            background: var(--secondary);
            color: white;
            font-family: 'Fredoka One', cursive;
            font-size: 1.3rem;
            padding: 12px 28px;
            border: 3px solid var(--dark);
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 0 var(--dark);
            transition: all 0.1s ease;
            margin: 10px;
            display: inline-block;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 0 var(--dark);
        }

        .btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 var(--dark);
        }

        .card {
            background: #FDFFB6;
            border: 3px dashed var(--dark);
            border-radius: 16px;
            padding: 20px;
            margin: 20px 0;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--dark);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>CONGKLATIKA</h1>
        <div class="mascot" id="mascot" onclick="playMascotSound()">🐸</div>
        <div class="card">
            Selamat Datang di Congklatika!<br>
            Media Pembelajaran Matematika Interaktif.
        </div>
        <button class="btn" onclick="playClickSound()">Mulai Bermain! 🎮</button>
    </div>

    <script type="module">
        // Load Tone.js as an ES module (works reliably on GitHub Pages and modern browsers)
        import * as Tone from 'https://cdn.jsdelivr.net/npm/tone@14.8.49/build/Tone.js';

        // Create synth
        const synth = new Tone.Synth().toDestination();

        // Expose functions to window so inline onclick handlers still work
        window.playClickSound = async function() {
            await Tone.start(); // ensures audio context is resumed after user gesture
            synth.triggerAttackRelease("C5", "8n");
            alert("Selamat belajar!");
        }

        window.playMascotSound = async function() {
            await Tone.start();
            synth.triggerAttackRelease("G5", "8n");
        }
    </script>
</body>
</html>
